<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interaktiv SVG | Eventnavn</title>
  <link rel="stylesheet" href="./starter.css">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <header class="site-header">
    <div class="header-content">
      <a class="site-logo" href="./">Eventnavn</a>
      <nav class="site-nav">
        <button>Menu</button>
        <ul class="menu" id="menu" popover>
          <li><a href="./">Forside</a></li>
          <li><a href="./svg.html" aria-current="page">Interaktiv SVG</a></li>
          <li><a href="./form.html">Formular</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="svg-layout">
      <div class="svg-placeholder">
        <svg class="svg-girls" viewBox="0 0 1920 1080" xmlns="http://w3.org">
          <!-- Indlæser hele jeres svg.svg-fil som baggrundskort -->
          <image href="./svg.svg" width="1920" height="1080" />

          <!-- Jeres "girls"-figur der rykker sig ovenpå kortet -->
          <g class="girls">
            <circle cx="960" cy="540" r="45" fill="#eddfce" stroke="#730000" stroke-width="8" />
          </g>
        </svg>
      </div>


      <div class="accordion">
        <details class="accordion-item" name="accordion" data-position="karneval" open>
          <summary>Karneval</summary>
          <div>
            <p>Her starter turen ved karnevallet.</p>
          </div>
        </details>

        <details class="accordion-item" name="accordion" data-position="modeshow">
          <summary>Modeshow</summary>
          <div>
            <p>Tryk her for at se pigerne rykke til modeshowet.</p>
          </div>
        </details>

        <details class="accordion-item" name="accordion" data-position="kobenhavn">
          <summary>København</summary>
          <div>
            <p>Tryk her for at se pigerne rykke til København.</p>
          </div>
        </details>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <p>Eventnavn</p>
      <p>Footer</p>
    </div>
  </footer>
  <script src="./script.js"></script>
</body>

</html>
